<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนบรูปภาพชิ้นงานเสีย</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card-box {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 24px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .upload-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
            transition: all 0.2s;
            cursor: pointer;
            display: block;
            text-align: center;
        }

        .upload-btn:hover {
            background: linear-gradient(135deg, #4f46e5 100%, #4338ca 100%);
            color: white;
        }

        .thumb-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
            justify-content: center;
            max-height: 220px;
            overflow-y: auto;
        }

        .thumb-wrapper {
            position: relative;
        }

        .thumb-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
        }

        .delete-thumb {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card-box">
    <h5 class="fw-bold text-dark mb-3">🖼️ ถ่ายรูปชิ้นงานเสีย (ได้หลายรูป)</h5>
    <p class="text-muted small mb-3">กดถ่ายรูปหรือเลือกรูปภาพเพิ่มได้สะสมหลายรูปตามต้องการ</p>

    <!-- ปุ่มเปิดกล้อง/เลือกรูปภาพ (กดซ้ำเพื่อสะสมรูปใหม่เพิ่มได้เรื่อยๆ) -->
    <button type="button" class="upload-btn mb-3" id="launchCameraBtn">
        📷 ถ่ายรูป / เพิ่มรูปภาพ
    </button>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="d-none">

    <!-- ส่วนแสดงรายการรูปที่ถ่ายสะสมไว้ในรอบนี้ -->
    <div id="previewContainer" class="d-none mt-2 p-2 border rounded-3 bg-light">
        <p class="text-success small fw-bold mb-2">✅ เลือกแล้ว (<span id="imgCount">0</span> รูป)</p>
        <div class="thumb-grid" id="thumbGrid"></div>
    </div>

    <!-- ปุ่มควบคุมด้านล่าง: ซ้าย = ยกเลิก, ขวา = ตกลง -->
    <div class="d-flex gap-2 justify-content-between mt-4">
        <button type="button" class="btn btn-secondary w-50 py-2 fw-bold rounded-3" id="cancelBtn">❌ ยกเลิก</button>
        <button type="button" class="btn btn-success w-50 py-2 fw-bold rounded-3" id="confirmBtn">✅ ตกลง</button>
    </div>
</div>

<script>
    const cameraInput = document.getElementById('cameraInput');
    const launchCameraBtn = document.getElementById('launchCameraBtn');
    const previewContainer = document.getElementById('previewContainer');
    const thumbGrid = document.getElementById('thumbGrid');
    const imgCount = document.getElementById('imgCount');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');

    let capturedImagesArray = []; // เก็บรูปภาพทั้งหมดที่ถ่ายในรอบนี้

    launchCameraBtn.addEventListener('click', function() {
        cameraInput.click();
    });

    cameraInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const imageDataUrl = event.target.result;
            capturedImagesArray.push(imageDataUrl);
            renderThumbnails();

            // รีเซ็ต input เพื่อให้กดถ่ายรูปเดิมซ้ำได้อีก
            cameraInput.value = '';
        };
        reader.readAsDataURL(file);
    });

    function renderThumbnails() {
        thumbGrid.innerHTML = '';
        capturedImagesArray.forEach((imgSrc, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'thumb-wrapper';

            const img = document.createElement('img');
            img.src = imgSrc;
            img.className = 'thumb-img';

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-thumb';
            delBtn.innerHTML = '&times;';
            delBtn.onclick = function() {
                capturedImagesArray.splice(index, 1);
                renderThumbnails();
            };

            wrapper.appendChild(img);
            wrapper.appendChild(delBtn);
            thumbGrid.appendChild(wrapper);
        });

        imgCount.innerText = capturedImagesArray.length;
        if (capturedImagesArray.length > 0) {
            previewContainer.classList.remove('d-none');
        } else {
            previewContainer.classList.add('d-none');
        }
    }

    // ปุ่มยกเลิก (ฝั่งซ้าย): เคลียร์รูปทั้งหมดทิ้ง
    cancelBtn.addEventListener('click', function() {
        capturedImagesArray = [];
        renderThumbnails();
        if (window.parent) {
            const parentModalEl = window.parent.document.getElementById('cameraModal');
            const modalInstance = window.parent.bootstrap.Modal.getInstance(parentModalEl);
            if (modalInstance) modalInstance.hide();
        }
    });

    // ปุ่มตกลง (ฝั่งขวา): ส่งอาร์เรย์ของรูปภาพทั้งหมดกลับไปที่ index.html
    confirmBtn.addEventListener('click', function() {
        if (capturedImagesArray.length === 0) {
            alert('กรุณาถ่ายรูปอย่างน้อย 1 รูป');
            return;
        }

        if (window.parent) {
            window.parent.postMessage({ type: 'WASTE_IMAGES_BATCH', images: capturedImagesArray }, '*');
            
            const parentModalEl = window.parent.document.getElementById('cameraModal');
            const modalInstance = window.parent.bootstrap.Modal.getInstance(parentModalEl);
            if (modalInstance) modalInstance.hide();
        }
    });
</script>

</body>
</html>
