<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกรูปภาพงานเสีย - Camera Capture</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 20px 10px;
        }

        .camera-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: none;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            background-color: #000000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-capture {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 28px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            transition: all 0.2s;
        }

        .btn-capture:hover {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            transform: scale(1.03);
            color: white;
        }

        .gallery-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .gallery-img:hover {
            transform: scale(1.04);
            border-color: #6366f1;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 600px;">
    <div class="card camera-card p-3 p-md-4">
        <h4 class="text-center fw-bold text-danger mb-3">📸 กล้องถ่ายภาพชิ้นงานเสีย</h4>

        <!-- ส่วนแสดงภาพจากกล้อง -->
        <div class="video-container mb-3">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="canvas" class="d-none"></canvas>
        </div>

        <!-- ปุ่มควบคุมกล้อง -->
        <div class="d-flex justify-content-center gap-2 mb-4">
            <button class="btn btn-outline-secondary rounded-3" id="switchCameraBtn">🔄 สลับกล้อง</button>
            <button class="btn btn-capture fs-5" id="captureBtn">📷 ถ่ายรูปภาพ</button>
        </div>

        <!-- แสดงภาพที่เพิ่งถ่ายล่าสุด -->
        <div id="previewContainer" class="d-none mb-4 p-3 border rounded-4 bg-light text-center">
            <h6 class="fw-bold text-success mb-2">✅ ภาพถ่ายล่าสุด</h6>
            <img id="photoPreview" class="img-fluid rounded-3 mb-2" style="max-height: 250px;" alt="ภาพถ่ายงานเสีย">
            <div>
                <a id="downloadBtn" download="waste-item.jpg" class="btn btn-sm btn-outline-primary rounded-3">💾 บันทึกรูปภาพลงเครื่อง</a>
            </div>
        </div>

        <!-- แสดงรายการรูปที่เคยถ่ายไว้ -->
        <div class="border-top pt-3">
            <h6 class="fw-bold text-dark mb-3">🖼️ คลังรูปภาพที่ถ่ายไว้ (Gallery)</h6>
            <div class="row g-2" id="galleryRow">
                <p class="text-muted small text-center py-3" id="noImgText">ยังไม่มีรูปภาพที่ถ่ายไว้</p>
            </div>
        </div>
    </div>
</div>

<!-- Modal ขยายดูรูปภาพใหญ่ -->
<div class="modal fade" id="viewImageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 text-center p-2">
            <div class="modal-header border-0 pb-0">
                <h6 class="fw-bold text-dark m-0">🔍 ดูรูปภาพขนาดเต็ม</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img id="fullImage" class="img-fluid rounded-3" alt="รูปภาพขนาดเต็ม">
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const webcamElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const switchCameraBtn = document.getElementById('switchCameraBtn');
    const photoPreview = document.getElementById('photoPreview');
    const previewContainer = document.getElementById('previewContainer');
    const downloadBtn = document.getElementById('downloadBtn');
    const galleryRow = document.getElementById('galleryRow');
    const noImgText = document.getElementById('noImgText');

    const viewModal = new bootstrap.Modal(document.getElementById('viewImageModal'));
    const fullImage = document.getElementById('fullImage');

    let currentFacingMode = 'environment'; // ใช้กล้องหลังเป็นหลัก
    let mediaStream = null;
    let savedPhotos = [];

    // เริ่มการทำงานของกล้อง
    async function startCamera() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
        }

        try {
            const constraints = {
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1280 },
                    height: { ideal: 960 }
                }
            };
            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            webcamElement.srcObject = mediaStream;
        } catch (err) {
            alert("ไม่สามารถเปิดกล้องได้ โปรดอนุญาตสิทธิ์การใช้งานกล้องในเบราว์เซอร์: " + err.message);
        }
    }

    // สลับกล้อง (หน้า/หลัง)
    switchCameraBtn.addEventListener('click', () => {
        currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
        startCamera();
    });

    // ปุ่มกดถ่ายรูป
    captureBtn.addEventListener('click', () => {
        const context = canvasElement.getContext('2d');
        canvasElement.width = webcamElement.videoWidth || 640;
        canvasElement.height = webcamElement.videoHeight || 480;

        context.drawImage(webcamElement, 0, 0, canvasElement.width, canvasElement.height);
        
        // แปลงภาพเป็น Data URL
        const imageDataUrl = canvasElement.toDataURL('image/jpeg');

        // แสดงภาพตัวอย่าง
        photoPreview.src = imageDataUrl;
        downloadBtn.href = imageDataUrl;
        previewContainer.classList.remove('d-none');

        // บันทึกลงอัลบั้ม
        addPhotoToGallery(imageDataUrl);
    });

    // เพิ่มรูปภาพลงในคลัง Gallery
    function addPhotoToGallery(dataUrl) {
        savedPhotos.unshift(dataUrl);
        noImgText.classList.add('d-none');

        const col = document.createElement('div');
        col.className = 'col-4';
        col.innerHTML = `<img src="${dataUrl}" class="gallery-img" alt="งานเสีย">`;
        
        col.querySelector('img').addEventListener('click', () => {
            fullImage.src = dataUrl;
            viewModal.show();
        });

        galleryRow.prepend(col);
    }

    // เปิดกล้องทันทีที่โหลดหน้าเว็บ
    window.addEventListener('load', startCamera);
</script>

</body>
</html>
