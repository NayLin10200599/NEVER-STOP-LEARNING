<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบกระเป๋าเงิน USDT On-Chain (ERC-20 / BEP-20)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: #ffffff; border-radius: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #26a17b, #1d7f61); color: white; padding: 24px; text-align: center; }
        .header h2 { font-size: 1.1rem; font-weight: 400; opacity: 0.9; margin-bottom: 8px; }
        .balance { font-size: 2.2rem; font-weight: bold; }
        .network-badge { display: inline-block; background: rgba(255, 255, 255, 0.25); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-top: 8px; }
        .content { padding: 24px; }
        .wallet-info { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem; word-break: break-all; color: #64748b; }
        .btn-connect { width: 100%; padding: 14px; background-color: #f97316; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .btn-connect.connected { background-color: #10b981; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: #475569; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
        .btn-send { width: 100%; padding: 14px; background-color: #26a17b; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn-send:disabled { background-color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>ยอดคงเหลือ USDT (On-Chain)</h2>
        <div class="balance" id="balanceDisplay">0.00</div>
        <div class="network-badge" id="networkDisplay">ยังไม่ได้เชื่อมต่อกระเป๋า</div>
    </div>

    <div class="content">
        <button id="connectBtn" class="btn-connect">เชื่อมต่อกระเป๋าเงิน (Connect Wallet)</button>
        <div class="wallet-info" id="walletInfo">Address: ยังไม่ได้เชื่อมต่อ</div>

        <form id="sendForm">
            <div class="form-group">
                <label for="recipient">Address ผู้รับ (0x...)</label>
                <input type="text" id="recipient" placeholder="0x..." required disabled>
            </div>
            <div class="form-group">
                <label for="amount">จำนวน USDT ที่ต้องการโอน</label>
                <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required disabled>
            </div>
            <button type="submit" id="sendBtn" class="btn-send" disabled>โอน USDT</button>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script>
    // กำหนดค่า Smart Contract Address ของ USDT ตามเครือข่ายที่คุณใช้งาน
    // ตัวอย่างนี้ใช้ USDT บน BNB Smart Chain (BEP-20)
    const USDT_ADDRESS = "0x55d398326f99059ff775485246999027b3197955"; 

    // ABI พื้นฐานสำหรับเรียกดู Balance และฟังก์ชัน Transfer ของ ERC-20 Token
    const ERC20_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    let provider, signer, userAddress, usdtContract;

    const connectBtn = document.getElementById('connectBtn');
    const walletInfo = document.getElementById('walletInfo');
    const balanceDisplay = document.getElementById('balanceDisplay');
    const networkDisplay = document.getElementById('networkDisplay');
    const recipientInput = document.getElementById('recipient');
    const amountInput = document.getElementById('amount');
    const sendBtn = document.getElementById('sendBtn');
    const sendForm = document.getElementById('sendForm');

    connectBtn.addEventListener('click', async () => {
        if (window.ethereum) {
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();

                const network = await provider.getNetwork();
                networkDisplay.textContent = `Chain: ${network.name.toUpperCase()} (ID: ${network.chainId})`;

                // เชื่อมต่อกับ Smart Contract ของ USDT
                usdtContract = new ethers.Contract(USDT_ADDRESS, ERC20_ABI, signer);

                // ดึงยอด USDT (USDT มี 18 decimals บน BSC แต่ถ้าเป็น Ethereum จะมี 6 decimals)
                // เพื่อความแม่นยำ เราสามารถดึงค่า decimals จาก contract โดยตรงได้เลย
                const decimals = await usdtContract.decimals();
                const rawBalance = await usdtContract.balanceOf(userAddress);
                const formattedBalance = ethers.utils.formatUnits(rawBalance, decimals);
                
                balanceDisplay.textContent = parseFloat(formattedBalance).toLocaleString('en-US', { minimumFractionDigits: 2 });

                walletInfo.textContent = `Address: ${userAddress}`;
                connectBtn.textContent = 'เชื่อมต่อแล้ว';
                connectBtn.classList.add('connected');

                recipientInput.disabled = false;
                amountInput.disabled = false;
                sendBtn.disabled = false;

            } catch (error) {
                console.error(error);
                alert('เชื่อมต่อไม่สำเร็จ: ' + error.message);
            }
        } else {
            alert('กรุณาเปิดผ่าน DApp Browser ของ TokenPocket หรือติดตั้ง MetaMask');
        }
    });

    sendForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const recipient = recipientInput.value;
        const amount = amountInput.value;

        try {
            sendBtn.disabled = true;
            sendBtn.textContent = 'กำลังทำรายการ...';

            const decimals = await usdtContract.decimals();
            // แปลงหน่วยตัวเลขให้เป็น Wei / BigNumber ตามทศนิยมของเหรียญ
            const parsedAmount = ethers.utils.parseUnits(amount, decimals);

            // เรียกใช้งานฟังก์ชัน transfer บน Smart Contract
            const tx = await usdtContract.transfer(recipient, parsedAmount);
            alert(`ส่งรายการสำเร็จ! Hash: ${tx.hash}`);

            await tx.wait();
            alert('ธุรกรรม USDT สำเร็จเรียบร้อยแล้ว!');

            // รีเฟรชยอดเงินใหม่
            const rawBalance = await usdtContract.balanceOf(userAddress);
            balanceDisplay.textContent = parseFloat(ethers.utils.formatUnits(rawBalance, decimals)).toLocaleString('en-US', { minimumFractionDigits: 2 });

        } catch (error) {
            console.error(error);
            alert('เกิดข้อผิดพลาด: ' + (error.data?.message || error.message));
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = 'โอน USDT';
        }
    });
</script>

</body>
</html>
