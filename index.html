<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึก ค้นหา และแก้ไขข้อมูลการผลิต</title>
    <!-- ใช้ Bootstrap 5 เพิ่มความสวยงาม -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Sarabun', sans-serif;
            padding-top: 30px;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header-title {
            color: #0d6efd;
            font-weight: bold;
        }
        .btn-action {
            padding: 2px 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <!-- ฟอร์มบันทึกข้อมูล -->
            <div class="card p-4 mb-4">
                <h3 class="text-center header-title mb-4" id="formTitle">ระบบบันทึกข้อมูลการผลิต</h3>
                
                <form id="dataForm">
                    <input type="hidden" id="editIndex" value="-1">
                    
                    <div class="mb-3">
                        <label for="productCode" class="form-label">รหัสสินค้า</label>
                        <input type="text" class="form-control" id="productCode" placeholder="เช่น 012662-62" value="012662-62" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="workQty" class="form-label">จำนวนงานที่ทำ (ชิ้น/ตัว)</label>
                            <input type="number" class="form-control" id="workQty" placeholder="0" value="100" min="0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="wasteQty" class="form-label">จำนวนของเสีย (ชิ้น/ตัว)</label>
                            <input type="number" class="form-control" id="wasteQty" placeholder="0" value="2" min="0" required>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-lg w-100" id="submitBtn">บันทึกข้อมูล</button>
                        <button type="button" class="btn btn-secondary btn-lg d-none" id="cancelEditBtn" onclick="resetForm()">ยกเลิกการแก้ไข</button>
                    </div>
                </form>
            </div>

            <!-- ส่วนตารางแสดงข้อมูล + ช่องค้นหา -->
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h4 class="m-0">รายการข้อมูลที่บันทึก</h4>
                    
                    <!-- ช่องค้นหาข้อมูล -->
                    <div>
                        <input type="text" id="searchInput" class="form-control" placeholder="🔍 ค้นหารหัสสินค้า หรือ ข้อมูล..." style="width: 250px;">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" id="dataTable">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>รหัสสินค้า</th>
                                <th class="text-center">จำนวนงาน</th>
                                <th class="text-center">เสีย</th>
                                <th class="text-center">คงเหลือ (ดี)</th>
                                <th class="text-center">วันที่-เวลา</th>
                                <th class="text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- รายการข้อมูลจะถูกสร้างผ่าน JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // ดึงข้อมูลเดิมจาก LocalStorage ถ้าไม่มีให้ใช้ข้อมูลตัวอย่าง
    let records = JSON.parse(localStorage.getItem('production_records')) || [
        {
            code: "012662-62",
            work: 100,
            waste: 2,
            good: 98,
            time: new Date().toLocaleString('th-TH')
        }
    ];

    // ฟังก์ชันแสดงผลข้อมูลลงในตาราง
    function renderTable(dataToDisplay = records) {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        if (dataToDisplay.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">ไม่พบข้อมูลที่ค้นหา</td></tr>`;
            return;
        }

        dataToDisplay.forEach((item, index) => {
            // หา index จริงในอาร์เรย์หลัก (เผื่อมีการกรองจากค้นหา)
            const realIndex = records.indexOf(item);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${item.code}</strong></td>
                <td class="text-center text-primary fw-bold">${item.work}</td>
                <td class="text-center text-danger fw-bold">${item.waste}</td>
                <td class="text-center text-success fw-bold">${item.good}</td>
                <td class="text-center text-muted small">${item.time}</td>
                <td class="text-center">
                    <button class="btn btn-warning btn-sm btn-action me-1" onclick="editRecord(${realIndex})">แก้ไข</button>
                    <button class="btn btn-danger btn-sm btn-action" onclick="deleteRecord(${realIndex})">ลบ</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    // เมื่อบันทึกฟอร์ม (ทั้งเพิ่มใหม่ และ บันทึกการแก้ไข)
    document.getElementById('dataForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const code = document.getElementById('productCode').value.trim();
        const work = parseInt(document.getElementById('workQty').value) || 0;
        const waste = parseInt(document.getElementById('wasteQty').value) || 0;
        const good = work - waste;
        const editIndex = parseInt(document.getElementById('editIndex').value);
        const time = new Date().toLocaleString('th-TH');

        if (editIndex === -1) {
            // กรณีเพิ่มข้อมูลใหม่
            records.unshift({ code, work, waste, good, time });
        } else {
            // กรณีแก้ไขข้อมูลเดิม
            records[editIndex] = { code, work, waste, good, time: time + " (แก้ไขแล้ว)" };
        }

        // เซฟลง LocalStorage
        saveAndRefresh();
        resetForm();
    });

    // ฟังก์ชันลบข้อมูล
    function deleteRecord(index) {
        const targetCode = records[index].code;
        if (confirm(`คุณต้องการลบข้อมูลรหัสสินค้า "${targetCode}" หรือไม่?`)) {
            records.splice(index, 1);
            saveAndRefresh();
            resetForm();
        }
    }

    // ฟังก์ชันแก้ไขข้อมูล (ดึงข้อมูลขึ้นไปที่ฟอร์มด้านบน)
    function editRecord(index) {
        const item = records[index];
        document.getElementById('productCode').value = item.code;
        document.getElementById('workQty').value = item.work;
        document.getElementById('wasteQty').value = item.waste;
        document.getElementById('editIndex').value = index;

        // ปรับเปลี่ยนหน้าตาฟอร์มเป็นโหมดแก้ไข
        document.getElementById('formTitle').innerText = "แก้ไขข้อมูลการผลิต";
        document.getElementById('submitBtn').innerText = "บันทึกการแก้ไข";
        document.getElementById('submitBtn').classList.replace('btn-primary', 'btn-warning');
        document.getElementById('cancelEditBtn').classList.remove('d-none');
        
        // สกรอลล์ขึ้นไปที่ฟอร์ม
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ยกเลิกโหมดแก้ไขและล้างฟอร์ม
    function resetForm() {
        document.getElementById('productCode').value = '012662-62';
        document.getElementById('workQty').value = '100';
        document.getElementById('wasteQty').value = '2';
        document.getElementById('editIndex').value = '-1';

        document.getElementById('formTitle').innerText = "ระบบบันทึกข้อมูลการผลิต";
        document.getElementById('submitBtn').innerText = "บันทึกข้อมูล";
        document.getElementById('submitBtn').classList.replace('btn-warning', 'btn-primary');
        document.getElementById('cancelEditBtn').classList.add('d-none');
    }

    // เซฟข้อมูลลง LocalStorage และอัปเดตการแสดงผล
    function saveAndRefresh() {
        localStorage.setItem('production_records', JSON.stringify(records));
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        
        if (searchTerm) {
            filterData(searchTerm);
        } else {
            renderTable();
        }
    }

    // ระบบค้นหาข้อมูล (Filter)
    document.getElementById('searchInput').addEventListener('input', function(e) {
        filterData(e.target.value.toLowerCase().trim());
    });

    function filterData(searchTerm) {
        const filteredRecords = records.filter(item => {
            return item.code.toLowerCase().includes(searchTerm) ||
                   item.work.toString().includes(searchTerm) ||
                   item.waste.toString().includes(searchTerm) ||
                   item.good.toString().includes(searchTerm) ||
                   item.time.toLowerCase().includes(searchTerm);
        });
        renderTable(filteredRecords);
    }

    // แสดงผลข้อมูลครั้งแรกเมื่อโหลดหน้า
    renderTable();
</script>

</body>
</html>
